<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northgate Street Capital</title>
<style>
:root { --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1b20; --muted:#6f6a73; --line:#e5e1e8;
  --brand:#4b2a7b; --brand-ink:#ffffff; --bot:#f1edf6; }
@media (prefers-color-scheme: dark) { :root { --bg:#131115; --panel:#1d1a21; --ink:#f3f1f5;
  --muted:#a59fab; --line:#34303a; --brand:#9b7bd1; --brand-ink:#131115; --bot:#28232f; } }
* { box-sizing: border-box; }
a { color: var(--brand); }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
.page { max-width: 880px; margin: 0 auto; padding: 48px 16px 140px; }
.page h1 { font-size: 30px; margin: 0 0 8px; } .page p { color: var(--muted); max-width: 560px; }
.demo-note { font-size: 13px; color: var(--muted); border:1px dashed var(--line); padding:10px 12px; border-radius:8px; max-width:560px; }
.chat { position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px));
  height: min(560px, calc(100vh - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.chat header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chat header b { display:block; } .chat header small { color: var(--muted); }
.log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; }
.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
.me { background: var(--brand); color: var(--brand-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.status { font-size: 12px; color: var(--muted); align-self: center; }
form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; }
button { border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 10px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="page">
  <h1>Northgate Street Capital</h1>
  <p>Multifamily and investor lending across the Northeast and Florida.</p>
  <p class="demo-note">Demo page for a fictional lender. The chat in the corner is the concierge
    widget; handoffs appear on the <a href="/review">reviewer page</a>.</p>
</div>
<div class="chat" role="complementary" aria-label="Chat with our assistant">
  <header><b>Ask us about financing</b><small>AI assistant · answers from approved information only</small></header>
  <div class="log" id="log" aria-live="polite"></div>
  <form id="form"><input id="input" autocomplete="off" placeholder="Type a message" aria-label="Message">
    <button id="send" type="submit">Send</button></form>
</div>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("input"), send = document.getElementById("send");
let sessionId = null;
function add(text, who) {
  const el = document.createElement("div");
  el.className = who === "status" ? "status" : "msg " + who;
  el.textContent = text; log.appendChild(el); log.scrollTop = log.scrollHeight;
}
fetch("/api/greeting").then(r => r.json()).then(d => { sessionId = d.session_id; add(d.reply, "bot"); });
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  add(text, "me"); input.value = ""; send.disabled = true;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    const d = await r.json(); sessionId = d.session_id; add(d.reply, "bot");
    if (d.handed_off && !document.querySelector(".status")) add("Handed off to a loan officer for review", "status");
  } catch { add("Something went wrong. Please try again.", "status"); }
  send.disabled = false; input.focus();
});
</script>
</body>
</html>
